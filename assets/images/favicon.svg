<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Premium Background Gradient -->
    <linearGradient id="fleetBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2a37"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <!-- Truck Gradient -->
    <linearGradient id="truckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e67e22"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="200" height="60" rx="14" fill="url(#fleetBg)"/>

  <!-- Soft Cream Accent Strip -->
  <rect x="0" y="40" width="200" height="20" rx="0" fill="#fff4e6" opacity="0.15"/>

  <!-- Truck Body -->
  <rect x="10" y="24" width="40" height="18" rx="5" fill="url(#truckGrad)"/>

  <!-- Cabin -->
  <rect x="38" y="28" width="14" height="14" rx="3" fill="#ffd8a8"/>

  <!-- Wheels -->
  <circle cx="20" cy="46" r="4" fill="#fff4e6"/>
  <circle cx="44" cy="46" r="4" fill="#fff4e6"/>

  <!-- Leaf (fresh ingredients) -->
  <path d="M18 20 C22 14, 30 14, 34 20"
        stroke="#22c55e"
        stroke-width="3"
        fill="none"
        stroke-linecap="round"/>


</svg>
