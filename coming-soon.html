<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Truck Fleet - Coming Soon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-dark text-white d-flex align-items-center justify-content-center text-center py-5"
    style="min-height: 100vh; background-image: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://placehold.co/1920x1080?text=Background'); background-size: cover; background-position: center;">

    <div class="container">
        <span class="badge bg-primary px-3 py-2 rounded-pill mb-4">We are launching soon</span>
        <h1 class="display-3 fw-bold mb-4">Something Amazing Is Coming</h1>
        <p class="lead text-light opacity-75 mb-5 mx-auto" style="max-width: 600px;">We are working hard to bring you
            the best food truck experience. Stay tuned for updates!</p>

        <div class="row justify-content-center gap-4 mb-5">
            <div class="col-auto">
                <div class="p-4 border border-light rounded-3" style="min-width: 120px; backdrop-filter: blur(5px);">
                    <h2 class="fw-bold mb-0">05</h2>
                    <small>Days</small>
                </div>
            </div>
            <div class="col-auto">
                <div class="p-4 border border-light rounded-3" style="min-width: 120px; backdrop-filter: blur(5px);">
                    <h2 class="fw-bold mb-0">12</h2>
                    <small>Hours</small>
                </div>
            </div>
            <div class="col-auto">
                <div class="p-4 border border-light rounded-3" style="min-width: 120px; backdrop-filter: blur(5px);">
                    <h2 class="fw-bold mb-0">45</h2>
                    <small>Minutes</small>
                </div>
            </div>
            <div class="col-auto">
                <div class="p-4 border border-light rounded-3" style="min-width: 120px; backdrop-filter: blur(5px);">
                    <h2 class="fw-bold mb-0">30</h2>
                    <small>Seconds</small>
                </div>
            </div>
        </div>

        <form class="mx-auto" style="max-width: 400px;">
            <div class="input-group mb-3">
                <input type="email" class="form-control form-control-lg" placeholder="Enter your email">
                <button class="btn btn-primary" type="button">Notify Me</button>
            </div>
        </form>

        <div class="mt-5">
            <a href="index.html" class="text-white text-decoration-none small opacity-75 hover-opacity-100"><i
                    class="bi bi-arrow-left me-1"></i> Back to Home</a>
        </div>
    </div>

</body>

</html>
