<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Truck Fleet - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body class="bg-light d-flex align-items-center py-5" style="min-height: 100vh;">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card border-0 shadow-lg rounded-4 p-4 p-sm-5">
                    <div class="text-center mb-4">
                        <a href="index.html" class="text-decoration-none fw-bold fs-2 text-primary"><img
                                src="assets/images/logo.svg" alt="Logo"></a>
                        <h4 class="mt-3 mb-1">Create Account</h4>
                        <p class="text-secondary">Join us to explore the best food trucks.</p>
                    </div>

                    <form action="login.html">
                        <div class="mb-3">
                            <label class="form-label">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i
                                        class="bi bi-person text-secondary"></i></span>
                                <input type="text" class="form-control border-start-0 ps-0" placeholder="John Doe">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i
                                        class="bi bi-envelope text-secondary"></i></span>
                                <input type="email" class="form-control border-start-0 ps-0"
                                    placeholder="name@example.com">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i
                                        class="bi bi-lock text-secondary"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" placeholder="••••••••">
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i
                                        class="bi bi-lock-fill text-secondary"></i></span>
                                <input type="password" class="form-control border-start-0 ps-0" placeholder="••••••••">
                            </div>
                        </div>
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="terms">
                            <label class="form-check-label small" for="terms">I agree to the <a href="#">Terms &
                                    Conditions</a></label>
                        </div>
                        <div class="d-grid mb-4">
                            <button type="submit" class="btn btn-primary btn-lg">Sign Up</button>
                        </div>
                    </form>

                    <div class="text-center">
                        <p class="mb-0 text-secondary">Already have an account? <a href="login.html"
                                class="text-primary text-decoration-none fw-bold">Sign In</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
